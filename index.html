<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revision Quiz</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="quiz">
        <h1>Revision Quiz: Python</h1>
        <p id="progress"></p>
        <h2 id="question"></h2>
        <div id="options"></div>
        <p id="feedback"></p>
        <button id="next-btn" class="big-btn">Next question</button>
        <p id="score"></p>
        <button id="restart-btn" class="big-btn">Play again</button>
    </main>
</body>
</html>
